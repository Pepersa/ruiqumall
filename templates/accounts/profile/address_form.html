{% extends "accounts/profile/base.html" %}
{% load static %}
{% block title %}{% if object %}编辑地址{% else %}新增地址{% endif %}{% endblock %}
{% block profile_content %}
<section class="page-head">
  <h1>{% if object %}编辑地址{% else %}新增地址{% endif %}</h1>
  <p>请返回<a href="{% url 'accounts:profile_addresses' %}">收货地址</a>页面，通过弹窗新增或编辑地址。</p>
</section>
{% endblock %}

{% block extra_js %}
<script>
  window.location.replace("{% url 'accounts:profile_addresses' %}?open={% if object %}edit-{{ object.pk }}{% else %}add{% endif %}");
</script>
{% endblock %}
